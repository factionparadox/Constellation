# Constellation: the Hyperon compositor with the Caelestia shell. System default
# (/etc/xdg/hyperon/hyperon.conf); to change it, copy it to ~/.config/hyperon/hyperon.conf first.
# The classic config format; Hyperon does not use Lua.

# --- the look: scrolling columns, as on niri, with Constellation's blue and gold
general {
    layout = scrolling
    gaps_in = 6
    gaps_out = 12
    border_size = 3
    col.active_border = rgba(5b84c8ff)
    col.inactive_border = rgba(2a3550ff)
}
scrolling {
    column_width = 0.5
    explicit_column_widths = 0.333, 0.5, 0.667, 1.0
    fullscreen_on_one_column = false
}
decoration {
    rounding = 10
}
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}
ecosystem {
    no_update_news = true
    no_donation_nag = true
}

# --- the Framework 13 Pro's panel at scale 2 (other screens: their best mode, scale 1)
monitor = eDP-1, preferred, auto, 2
monitor = , preferred, auto, 1

# --- keyboard: English (gb) and Russian; Alt+Shift switches between them
input {
    kb_layout = gb,ru
    kb_options = grp:alt_shift_toggle
    numlock_by_default = true
    touchpad {
        tap-to-click = true
        natural_scroll = true
        disable_while_typing = true
    }
}

env = QT_QPA_PLATFORM,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# --- the shell, clipboard history and the password prompt agent
exec-once = /usr/lib/constellation/start-shell
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = /usr/lib/polkit-kde-authentication-agent-1

# --- Workstations
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER SHIFT, 1, movetoworkspacesilent, 1
bind = SUPER SHIFT, 2, movetoworkspacesilent, 2
bind = SUPER SHIFT, 3, movetoworkspacesilent, 3
bind = SUPER SHIFT, 4, movetoworkspacesilent, 4
bind = SUPER SHIFT, 5, movetoworkspacesilent, 5
bind = SUPER SHIFT, 6, movetoworkspacesilent, 6
bind = SUPER SHIFT, 7, movetoworkspacesilent, 7
bind = SUPER SHIFT, 8, movetoworkspacesilent, 8
bind = SUPER SHIFT, 9, movetoworkspacesilent, 9
# Overview of the workstation: every column fitted on screen at once
bind = SUPER, Tab, layoutmsg, fit all

# --- Applications
bind = SUPER, W, exec, firefox
bind = SUPER, T, exec, kitty
bind = SUPER, D, exec, discord
bind = SUPER, V, exec, vlc
bind = SUPER, E, exec, dolphin
bind = SUPER, space, exec, qs -c caelestia ipc call drawers toggle launcher
bind = SUPER, A, exec, kitty --title ani-cli ani-cli
bind = SUPER, P, exec, protonvpn-app
bind = SUPER ALT, R, exec, kitty constellation-russian --pause words

# --- Windows (Super+left drag moves, Super+right drag resizes)
bind = SUPER, Q, killactive,
bind = SUPER, F, fullscreen, 1
bind = SUPER, R, layoutmsg, colresize +conf
bind = SUPER SHIFT, space, togglefloating,
bind = SUPER SHIFT, F, fullscreen, 0
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d
bind = SUPER SHIFT, left, layoutmsg, swapcol l
bind = SUPER SHIFT, right, layoutmsg, swapcol r
bind = SUPER SHIFT, up, movewindow, u
bind = SUPER SHIFT, down, movewindow, d
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
bind = SUPER, mouse_up, workspace, e-1
bind = SUPER, mouse_down, workspace, e+1

# --- Caelestia shell panels
bind = SUPER SHIFT, D, exec, qs -c caelestia ipc call drawers toggle dashboard
bind = SUPER, N, exec, qs -c caelestia ipc call drawers toggle utilities
bind = SUPER SHIFT, N, exec, qs -c caelestia ipc call drawers toggle sidebar
bind = SUPER SHIFT, V, exec, qs -c caelestia ipc call clipboard toggle
bind = SUPER SHIFT, W, exec, qs -c caelestia ipc call wallpaper toggle
bind = SUPER, Escape, exec, qs -c caelestia ipc call drawers toggle session

# --- Session
bind = SUPER, X, exec, qs -c caelestia ipc call lock lock
bind = SUPER, Z, exec, sh -c 'qs -c caelestia ipc call lock lock; sleep 1; systemctl suspend'
bind = SUPER SHIFT, E, exit,

# --- Screenshots
bind = SUPER SHIFT, S, exec, sh -c 'grim -g "$(slurp)" - | swappy -f -'
bind = , Print, exec, sh -c 'grim - | swappy -f -'

# --- Keyboard and media (they repeat while held, and work on the lock screen)
bindel = , XF86AudioRaiseVolume, exec, sh -c 'wpctl set-mute @DEFAULT_AUDIO_SINK@ 0; wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+'
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
