# MangoWM for the login screen only: no key bindings, nothing but Constellation's greeter.
# When the greeter exits (a session is starting, or it crashed), mango exits too.
monitor_rule=name:eDP-1,scale:2
xkb_rules_layout=gb,ru
xkb_rules_options=grp:alt_shift_toggle
numlock_on=1
tap_to_click=1
exec_once=qs -p /usr/share/constellation/greeter/shell.qml; mmsg dispatch quit
