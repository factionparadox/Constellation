# Hyperon for the login screen only: no key bindings, nothing but Constellation's greeter.
# When the greeter exits (a session is starting, or it crashed), Hyperon exits too.
monitor = eDP-1, preferred, auto, 2
monitor = , preferred, auto, 1
input {
    kb_layout = gb,ru
    kb_options = grp:alt_shift_toggle
    numlock_by_default = true
    touchpad {
        tap-to-click = true
    }
}
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}
ecosystem {
    no_update_news = true
    no_donation_nag = true
}
exec-once = sh -c 'qs -p /usr/share/constellation/greeter/shell.qml; hyprctl dispatch exit'
