# Constellation: MangoWM with the Caelestia shell. System default (/etc/mango/config.conf);
# to change it, copy it to ~/.config/mango/config.conf first.

# --- the look: scrolling columns, as on niri, with Constellation's blue and gold
tag_rule=id:1,layout_name:scroller
tag_rule=id:2,layout_name:scroller
tag_rule=id:3,layout_name:scroller
tag_rule=id:4,layout_name:scroller
tag_rule=id:5,layout_name:scroller
tag_rule=id:6,layout_name:scroller
tag_rule=id:7,layout_name:scroller
tag_rule=id:8,layout_name:scroller
tag_rule=id:9,layout_name:scroller
scroller_default_proportion=0.5
scroller_proportion_preset=0.33,0.5,0.67,1.0
scroller_focus_center=0
border_px=3
border_radius=10
focus_color=0x5b84c8ff
border_color=0x2a3550ff
gap_inner_horizontal=12
gap_inner_vertical=12
gap_outer_horizontal=12
gap_outer_vertical=12

# --- the Framework 13 Pro's panel at scale 2
monitor_rule=name:eDP-1,scale:2

# --- keyboard: English (gb) and Russian; Alt+Shift switches between them
xkb_rules_layout=gb,ru
xkb_rules_options=grp:alt_shift_toggle
numlock_on=1
tap_to_click=1
trackpad_natural_scrolling=1
disable_while_typing=1

env=QT_QPA_PLATFORM,wayland
env=ELECTRON_OZONE_PLATFORM_HINT,auto
env=XDG_CURRENT_DESKTOP,mango

# --- the shell, clipboard history and the password prompt agent
exec_once=/usr/lib/constellation/start-shell
exec_once=wl-paste --type text --watch cliphist store
exec_once=wl-paste --type image --watch cliphist store
exec_once=/usr/lib/polkit-kde-authentication-agent-1

# --- Workstations
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER+SHIFT,1,tagsilent,1
bind=SUPER+SHIFT,2,tagsilent,2
bind=SUPER+SHIFT,3,tagsilent,3
bind=SUPER+SHIFT,4,tagsilent,4
bind=SUPER+SHIFT,5,tagsilent,5
bind=SUPER+SHIFT,6,tagsilent,6
bind=SUPER+SHIFT,7,tagsilent,7
bind=SUPER+SHIFT,8,tagsilent,8
bind=SUPER+SHIFT,9,tagsilent,9
bind=SUPER,Tab,toggleoverview,

# --- Applications
bind=SUPER,w,spawn,firefox
bind=SUPER,t,spawn,kitty
bind=SUPER,d,spawn,discord
bind=SUPER,v,spawn,vlc
bind=SUPER,e,spawn,dolphin
bind=SUPER,space,spawn,qs -c caelestia ipc call drawers toggle launcher
bind=SUPER,a,spawn,kitty --title ani-cli ani-cli
bind=SUPER,p,spawn,protonvpn-app
bind=SUPER+ALT,r,spawn,kitty constellation-russian --pause words

# --- Windows (Super+left drag moves, Super+right drag resizes)
bind=SUPER,q,killclient,
bind=SUPER,f,togglemaximizescreen,
bind=SUPER,r,switch_proportion_preset,
bind=SUPER+SHIFT,space,togglefloating,
bind=SUPER+SHIFT,f,togglefullscreen,
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# --- Caelestia shell panels
bind=SUPER+SHIFT,d,spawn,qs -c caelestia ipc call drawers toggle dashboard
bind=SUPER,n,spawn,qs -c caelestia ipc call drawers toggle utilities
bind=SUPER+SHIFT,n,spawn,qs -c caelestia ipc call drawers toggle sidebar
bind=SUPER+SHIFT,v,spawn,qs -c caelestia ipc call clipboard toggle
bind=SUPER+SHIFT,w,spawn,qs -c caelestia ipc call wallpaper toggle
bind=SUPER,Escape,spawn,qs -c caelestia ipc call drawers toggle session

# --- Session
bind=SUPER,x,spawn,qs -c caelestia ipc call lock lock
bind=SUPER,z,spawn_shell,qs -c caelestia ipc call lock lock; sleep 1; systemctl suspend
bind=SUPER+SHIFT,e,quit,

# --- Screenshots
bind=SUPER+SHIFT,s,spawn_shell,grim -g "$(slurp)" - | swappy -f -
bind=NONE,Print,spawn_shell,grim - | swappy -f -

# --- Keyboard and media
bind=NONE,XF86AudioRaiseVolume,spawn_shell,wpctl set-mute @DEFAULT_AUDIO_SINK@ 0; wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl set 5%+
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous
