# Cap ZFS's file cache (the ARC) at 4 GiB. Left alone, OpenZFS on Linux lets it grow to half the
# RAM, and it shows as memory in use. Applied at every boot; change it here or, for one boot,
# echo a size in bytes into /sys/module/zfs/parameters/zfs_arc_max.
w /sys/module/zfs/parameters/zfs_arc_max - - - - 4294967296
