# Constellation's paru settings (your copy: ~/.config/paru/paru.conf).
# paru shows each AUR package's PKGBUILD and changes before building it: read them.
# That review is the point of using paru; do not turn it off.
# Constellation's own repository pins its AUR packages (quickshell-git and the rest), so no
# Devel here: paru would otherwise replace them with whatever the AUR has now.
[options]
BottomUp
SudoLoop
CombinedUpgrade
UpgradeMenu
NewsOnUpgrade
CleanAfter
