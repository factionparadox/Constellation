# AUR packages Constellation builds into its own repository, each pinned to a reviewed
# AUR git commit. Built in this order (a package's AUR dependencies come first).
# Pin or update with:  build/aur-pin.sh NAME   (shows the PKGBUILD or the diff before pinning)
# Files an AUR package is missing go in pkgs/aur-overlays/NAME/ (checked by the PKGBUILD's sums).
# A -git package also needs src=COMMIT: the upstream commit to build (it would follow a branch).
# quickshell-git: src is a master commit: Caelestia needs Quickshell's git version, not a release.
# name                                AUR commit                                upstream (git packages)
